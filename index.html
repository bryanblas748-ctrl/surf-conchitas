<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ANCÓN SWELL CREW • Km 43 | Surf & Bodyboard Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #06090f;
      --card-bg: #0f1623;
      --card-border: #1e293b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
    }
    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.08) 0%, transparent 55%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    .font-crew {
      font-family: 'Chakra Petch', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #06090f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    .accordion-content {
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
    }
    .accordion-content.open {
      max-height: 2000px;
      opacity: 1;
    }
    .chevron-icon {
      transition: transform 0.3s ease;
    }
    .chevron-icon.rotated {
      transform: rotate(180deg);
    }

    @media (min-width: 1024px) {
      .app-container {
        max-width: 1120px !important;
        padding-top: 2.5rem;
      }
      .desktop-grid {
        display: grid;
        grid-template-columns: 400px 1fr;
        gap: 2rem;
        align-items: start;
      }
      .desktop-sticky-panel {
        position: sticky;
        top: 2rem;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-14 selection:bg-sky-500 selection:text-white">

  <div class="app-container max-w-md mx-auto px-4 pt-6">

    <!-- Header con Identidad Conera / Km 43 -->
    <header class="flex items-start justify-between mb-5">
      <div>
        <div class="flex flex-wrap items-center gap-2 mb-1.5">
          <span class="px-2 py-0.5 rounded bg-sky-500/15 border border-sky-500/30 font-crew text-[10px] lg:text-xs font-bold tracking-wider text-sky-400 uppercase">
            KM 43 • LIMA NORTE
          </span>
          <div id="liveIndicator" class="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-amber-400">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
            </span>
            Conectando...
          </div>
        </div>
        <h1 id="spotTitle" class="font-crew text-3xl lg:text-4xl font-bold tracking-tight text-white uppercase">Las Conchitas</h1>
        <p id="spotSubtitle" class="text-xs lg:text-sm text-slate-400 mt-0.5 font-medium">Point Break • Buenas Derechas • Ancón</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="shareWhatsApp()" title="Mandar parte al grupo" class="p-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/25 active:scale-95 transition">
          <svg class="w-4 h-4 lg:w-5 lg:h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/>
          </svg>
        </button>
        <button onclick="fetchSurfData()" title="Actualizar reporte en vivo" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 active:scale-95 transition">
          <svg id="refreshIcon" class="w-4 h-4 lg:w-5 lg:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Spot Selector Pills -->
    <nav class="grid grid-cols-3 gap-2 p-1 rounded-2xl bg-slate-900/90 border border-slate-800/80 mb-6">
      <button onclick="selectSpot('conchitas')" id="btn-conchitas" class="spot-btn py-2.5 px-2 rounded-xl text-xs lg:text-sm font-bold transition-all bg-sky-500 text-slate-950 shadow-sm">
        Las Conchitas
      </button>
      <button onclick="selectSpot('rocas')" id="btn-rocas" class="spot-btn py-2.5 px-2 rounded-xl text-xs lg:text-sm font-bold text-slate-400 hover:text-white transition-all">
        Las Rocas
      </button>
      <button onclick="selectSpot('sanjuan')" id="btn-sanjuan" class="spot-btn py-2.5 px-2 rounded-xl text-xs lg:text-sm font-bold text-slate-400 hover:text-white transition-all">
        Playa San Juan
      </button>
    </nav>

    <!-- Desktop Grid Layout -->
    <div class="desktop-grid">

      <!-- Left Panel: Main Card -->
      <div class="desktop-sticky-panel mb-6 lg:mb-0">
        <section>
          <div class="flex items-center justify-between mb-2.5 px-1">
            <button onclick="changeShift(-1)" class="p-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white active:scale-90 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span id="shiftBadge" class="text-[11px] lg:text-xs font-bold tracking-wider uppercase text-sky-400">
              SESIÓN MADRUGADA • 06:00 - 09:00
            </span>
            <button onclick="changeShift(1)" class="p-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white active:scale-90 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>

          <div id="waveCard" class="relative overflow-hidden rounded-3xl bg-gradient-to-b from-[#131c2e] to-[#0b101b] border border-slate-800/90 p-5 lg:p-6 shadow-2xl transition-all duration-300">

            <!-- Badge de Condición y Tipo de Ola -->
            <div class="flex items-center justify-between mb-3">
              <span id="cardConditionBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] lg:text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">
                <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
                Sincronizando...
              </span>
              <span id="cardBreakBadge" class="px-2.5 py-1 rounded-md text-[10px] lg:text-xs font-crew font-bold uppercase tracking-wider bg-sky-500/10 text-sky-300 border border-sky-500/20">
                DERECHA
              </span>
            </div>

            <!-- Visualizador Animado de Ola en Vivo -->
            <div class="relative w-full h-16 my-2 rounded-2xl bg-[#070b12]/80 border border-slate-800/60 overflow-hidden flex items-center justify-between px-3">
              <canvas id="waveCanvas" class="absolute inset-0 w-full h-full"></canvas>
              <div class="relative z-10 flex items-center gap-1.5 text-[10px] font-semibold text-slate-300 bg-slate-950/70 px-2 py-1 rounded-lg backdrop-blur-sm">
                <span>Swell:</span>
                <span id="cardSwellDir" class="text-sky-400 font-bold">--</span>
              </div>
              <div class="relative z-10 flex items-center gap-1.5 text-[10px] font-semibold text-slate-300 bg-slate-950/70 px-2 py-1 rounded-lg backdrop-blur-sm">
                <span>Power:</span>
                <span id="cardPowerLevel" class="text-emerald-400 font-bold">--</span>
              </div>
            </div>

            <!-- Big Metrics -->
            <div class="grid grid-cols-3 divide-x divide-slate-800/8
